<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Token | QueueLess</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><h2>QueueLess</h2><a href="student.html">Dashboard</a></header><main class="container"><section class="panel center"><p class="eyebrow">YOUR DIGITAL TOKEN</p><h1 id="tokenNumber">—</h1><p id="tokenDetails">Token details will appear here.</p><a class="btn" href="student.html">Back to dashboard</a></section></main><script>const t=JSON.parse(localStorage.getItem('queueLessLastToken')||'null');if(t){document.getElementById('tokenNumber').textContent=t.token_number;document.getElementById('tokenDetails').textContent=t.service+' • Status: '+t.status;}else{document.getElementById('tokenDetails').textContent='No token found. Generate a token first.';}</script></body></html>
