<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student | QueueLess</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><h2>QueueLess</h2><button class="link-btn" onclick="logout()">Logout</button></header>
<main class="container"><section class="panel"><h1>Student Dashboard</h1><p>Choose a service and generate your digital token.</p><form id="tokenForm"><label>Service</label><select id="service"><option value="Office">Office</option><option value="Library">Library</option><option value="Fee Counter">Fee Counter</option><option value="Department">Department</option></select><button class="btn" type="submit">Generate Token</button></form><div id="tokenResult"></div></section><section class="panel"><h2>Queue Status</h2><button class="btn secondary" id="refreshQueue">Refresh status</button><div id="queueStatus">No queue information loaded.</div></section></main><script src="js/token.js"></script></body></html>
