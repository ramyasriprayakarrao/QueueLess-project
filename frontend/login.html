<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | QueueLess</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="auth-wrap"><form class="panel form" id="loginForm"><h1>Welcome back</h1><p>Sign in to QueueLess</p><label>Email</label><input id="email" type="email" required placeholder="name@example.com"><label>Password</label><input id="password" type="password" required placeholder="Password"><label>Login as</label><select id="role"><option value="student">Student</option><option value="admin">Admin</option></select><button class="btn" type="submit">Login</button><p id="message" class="message"></p><small>New here? <a href="index.html">Back to home</a></small></form></main><script src="js/auth.js"></script></body></html>
